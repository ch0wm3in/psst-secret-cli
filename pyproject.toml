[project]
name = "psst-secret-cli"
version = "0.1.0"
description = "Command-line client for psst-secret"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "typer>=0.28.0",
]

[project.scripts]
psst = "psst_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "psst_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running psst-secret server (set PSST_TEST_SERVER)"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
]
