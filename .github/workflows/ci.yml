name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and spec vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -v

  integration:
    name: Integration (ghcr.io/ch0wm3in/psst-secret)
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: tests/integration/docker-compose.yml
      PSST_TEST_SERVER: http://127.0.0.1:18000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Start psst-secret
        run: |
          docker compose up -d
          for _ in $(seq 1 60); do
            curl -fsS "$PSST_TEST_SERVER/api/v1/info" && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: uv run pytest -v -m integration
      - name: Server logs
        if: failure()
        run: docker compose logs
